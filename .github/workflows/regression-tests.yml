name: Regression Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Static and Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装项目依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 执行静态回归
        run: npm run test:static

      - name: 执行浏览器交互回归
        run: npm run test:browser

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-failure
          path: artifacts/browser-regression/
          if-no-files-found: ignore
