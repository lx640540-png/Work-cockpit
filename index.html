function isoWeekNumber(date){
 let target=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())),day=target.getUTCDay()||7;target.setUTCDate(target.getUTCDate()+4-day);let start=new Date(Date.UTC(target.getUTCFullYear(),0,1));return Math.ceil((((target-start)/86400000)+1)/7);
}
function weekInputValue(key){let date=parseDate(key);return date.getFullYear()+"-W"+pad(isoWeekNumber(date))}
function weekKeyFromInput(value){

}

function quickCounts(){

 return{open:open.length,inbox:open.filter(task=>task.inbox||task.status==="待处理").length,waiting:open.filter(task=>task.status==="等待").length,followup:open.filter(task=>task.status==="等待"&&task.followup&&task.followup<=today).length,overdue:open.filter(task=>task.due&&task.due<today).length,paused:open.filter(task=>task.status==="暂停").length,done:state.tasks.filter(task=>isDone(task)&&!task.archived).length,archived:state.tasks.filter(task=>task.archived).length};
}
function filteredTasks(){
 let today=todayKey(),items=state.tasks.filter(task=>{
  if(taskFilter.quick==="open"&&(task.archived||isDone(task)))return false;
  if(taskFilter.quick==="inbox"&&!(!task.archived&&!isDone(task)&&(task.inbox||task.status==="待处理")))return false;
  if(taskFilter.quick==="waiting"&&!(!task.archived&&!isDone(task)&&task.status==="等待"))return false;
  if(taskFilter.quick==="followup"&&!(!task.archived&&!isDone(task)&&task.status==="等待"&&task.followup&&task.followup<=today))return false;
  if(taskFilter.quick==="overdue"&&!(!task.archived&&!isDone(task)&&task.due&&task.due<today))return false;
  if(taskFilter.quick==="paused"&&!(!task.archived&&!isDone(task)&&task.status==="暂停"))return false;
  if(taskFilter.quick==="done"&&!(!task.archived&&isDone(task)))return false;
  if(taskFilter.quick==="archived"&&!task.archived)return false;
  if(taskFilter.project.length&&!taskFilter.project.includes(task.project))return false;if(taskFilter.type.length&&!taskFilter.type.includes(task.type))return false;if(taskFilter.status.length&&!taskFilter.status.includes(task.status))return false;
  let query=taskFilter.query.toLowerCase();return!query||(task.title+" "+task.nextAction+" "+strip(task.notes)+" "+projectName(task.project)).toLowerCase().includes(query);
 });

}

function nextRepeatDate(task){
 let base=parseDate(task.completed||todayKey()),next=new Date(base);
 if(task.repeat==="daily")next=addDays(next,1);else if(task.repeat==="weekly"||task.repeat==="after7")next=addDays(next,7);else if(task.repeat==="monthly")next.setMonth(next.getMonth()+1);else if(task.repeat==="weekdays"){do{next=addDays(next,1)}while([0,6].includes(next.getDay()))}else return"";
 return fmt(next);
}
function generateRepeat(task,draft){
 let date=nextRepeatDate(task);if(!date||task.repeatUntil&&date>task.repeatUntil)return;
 let copy=normalizeTask({...clone(task),id:uid("task"),status:"待处理",completed:"",planDate:date,due:"",focus:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),attachments:[],relatedTaskIds:[]});draft.tasks.unshift(copy);
}
function setTaskStatus(item,value,draft,options={}){
 let wasDone=isDone(item);item.status=value;

 if(value==="已完成"){if(!item.completed)item.completed=todayKey();if(!wasDone)generateRepeat(item,draft)}else item.completed="";
 item.updatedAt=new Date().toISOString();
}
