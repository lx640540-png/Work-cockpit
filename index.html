const $=(selector,root=document)=>root.querySelector(selector);

function richNormalizeListStructure(root){
 let changed=true;while(changed){changed=false;
  Array.from(root.querySelectorAll("ul,ol")).reverse().forEach(list=>{if(!Array.from(list.children).some(child=>child.tagName==="LI")){list.remove();changed=true}});
  Array.from(root.querySelectorAll("ul,ol")).forEach(list=>{let next=list.nextElementSibling;if(next&&next.tagName===list.tagName){while(next.firstElementChild)list.appendChild(next.firstElementChild);next.remove();changed=true}});
 }

}

  if(node.nodeType===3)return document.createTextNode(node.data);

  $("#syncDialogBody").innerHTML='<div class="data-list"><div class="data-item"><div><b>'+esc(this.user?"已登录":"本地模式")+'</b><small>'+esc(account)+' · '+esc($("#syncButton").textContent)+'</small></div><button class="btn" id="syncNow" '+(this.user?"":"disabled")+'>立即同步</button></div>'+pending+'</div><div class="page-actions" style="margin-top:16px"><button class="btn" id="showLogin">'+(this.user?"切换账号":"登录云端")+'</button>'+(this.user?'<button class="btn danger" id="logoutCloud">退出登录</button>':"")+'</div>';
  $("#syncNow")?.addEventListener("click",()=>this.push(true));$("#showLogin")?.addEventListener("click",()=>{closeDialog("syncDialog");$("#cloudGate").hidden=false});$("#logoutCloud")?.addEventListener("click",()=>this.logout());
  $("#uploadImport")?.addEventListener("click",()=>{this.importPending=false;this.push(true);this.renderStatus()});$("#discardImport")?.addEventListener("click",async()=>{let row=await this.fetchRemote();if(row)this.applyRemote(row,true);this.importPending=false;this.renderStatus()});
 },
 async logout(){this.syncEpoch++;this.pendingPush=false;this.pushing=false;if(this.client&&this.channel){await this.client.removeChannel(this.channel);this.channel=null}if(this.client)await this.client.auth.signOut();this.user=null;this.version=0;this.rowExists=false;this.lastHash="";this.pendingRemote=null;clearTimeout(this.timer);localStorage.setItem(LOCAL_MODE_KEY,"1");this.setStatus("local","本地模式");closeDialog("syncDialog")},
 async uploadAttachments(taskId,files){
  if(!taskById(taskId))return toast("请先保存事项，再上传附件");
  if(!this.user||!this.client)return toast("附件需要登录云端后上传");
  for(let file of files){
   if(file.size>50*1024*1024){toast(file.name+" 超过 50MB");continue}
   let safe=file.name.replace(/[^\w.\-\u4e00-\u9fa5]/g,"_"),path=this.user.id+"/"+taskId+"/"+Date.now()+"-"+safe,result=await this.client.storage.from("task-attachments").upload(path,file,{upsert:false});
   if(result.error){toast("上传失败："+file.name);continue}
   let meta={id:uid("attachment"),name:file.name,type:file.type||"application/octet-stream",size:file.size,path,createdAt:new Date().toISOString()};
   commit("上传附件",draft=>{let task=draft.tasks.find(item=>item.id===taskId);if(task)task.attachments.push(meta)},{immediate:true});if(taskDraft?.id===taskId){taskDraft.attachments.push(meta);let list=$(".attachment-list");if(list)list.innerHTML=attachmentMarkup()}toast("附件已上传");
  }
 },
 async previewAttachment(item,container){
  if(!item||!this.client||!this.user)return;let result=await this.client.storage.from("task-attachments").createSignedUrl(item.path,1800);
  if(result.error)return container.textContent="无法生成预览地址";
  let url=result.data.signedUrl;
  if(item.type.startsWith("image/"))container.innerHTML='<img src="'+esc(url)+'" alt="'+esc(item.name)+'">';
  else if(item.type==="application/pdf")container.innerHTML='<iframe src="'+esc(url)+'" style="width:100%;height:260px;border:0"></iframe>';
  else container.innerHTML='<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">打开 / 下载 '+esc(item.name)+'</a>';
 },
 async removeAttachment(taskId,item){
  if(!item)return;commit("移除附件",draft=>{let task=draft.tasks.find(value=>value.id===taskId);if(task)task.attachments=task.attachments.filter(value=>value.id!==item.id)},{immediate:true});if(taskDraft?.id===taskId){taskDraft.attachments=taskDraft.attachments.filter(value=>value.id!==item.id);if(attachmentPreviewId===item.id){attachmentPreviewId="";let preview=$("#attachmentPreview");if(preview){preview.textContent="选择附件后在这里预览";preview.classList.remove("has-preview")}}let list=$(".attachment-list");if(list)list.innerHTML=attachmentMarkup()}toast("附件已移除；云端文件暂时保留，可通过撤销恢复")
 }
};
window.CloudSync=Cloud;
$("#keepLocalButton").addEventListener("click",()=>Cloud.keepLocal());
$("#useRemoteButton").addEventListener("click",()=>Cloud.useRemote());
$$("[data-auth-mode]").forEach(button=>button.addEventListener("click",()=>{Cloud.authMode=button.dataset.authMode;$$("[data-auth-mode]").forEach(item=>item.classList.toggle("active",item===button));$("#authSubmit").textContent=Cloud.authMode==="login"?"登录":"注册";$("#authPassword").autocomplete=Cloud.authMode==="login"?"current-password":"new-password"}));
$("#localModeButton").addEventListener("click",()=>{localStorage.setItem(LOCAL_MODE_KEY,"1");$("#cloudGate").hidden=true;Cloud.setStatus("local","本地模式")});
$("#saveCloudConfig").addEventListener("click",()=>{let url=$("#cloudUrl").value.trim().replace(/\/$/,""),key=$("#cloudKey").value.trim();if(!url.startsWith("https://")||key.length<20)return toast("连接设置格式不正确");localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url,key}));toast("连接设置已保存，请刷新页面")});
$("#authForm").addEventListener("submit",async event=>{
 event.preventDefault();let email=$("#authEmail").value.trim(),password=$("#authPassword").value,message=$("#authMessage");message.textContent="正在处理……";
 try{let result=Cloud.authMode==="login"?await Cloud.client.auth.signInWithPassword({email,password}):await Cloud.client.auth.signUp({email,password});if(result.error)throw result.error;if(Cloud.authMode==="register"&&!result.data.session)message.textContent="注册成功，请检查邮箱完成验证。";else{message.textContent="";await Cloud.startSession(result.data.session)}}catch(error){message.textContent=error.message||"登录失败"}
});
let dateWatch=todayKey();
function checkDateChange(){let next=todayKey();if(next===dateWatch)return;dateWatch=next;ensureCurrentWeek();selectedWeekKey=currentWeekKey();activateScheduledTasks();captureCurrentWeek();saveLocal(true);requestRender()}
setInterval(checkDateChange,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDateChange()});
window.addEventListener("online",()=>{if(Cloud.user)Cloud.push()});
async function boot(){
 applyTheme(localStorage.getItem(THEME_KEY)||"system",false);
 renderApp();
 await Cloud.init();
 refreshScheduledTasks();
 document.documentElement.classList.remove("booting");
}
boot().catch(error=>{console.error("应用启动失败",error);document.documentElement.classList.remove("booting");toast("启动时发生错误，本机数据未删除")});
</script></body></html>
